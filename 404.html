  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox__close" type="button" aria-label="Close (Esc)">×</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous photo (Left arrow)">←</button>
    <img class="lightbox__img" alt="" />
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photo (Right arrow)">→</button>
    <span class="lightbox__count" aria-live="polite"></span>
  </div>
  <script>
    (function () {
      var shots = document.querySelectorAll("a.ev-shot");
      if (!shots.length) return;
      var box = document.getElementById("lightbox");
      var img = box.querySelector(".lightbox__img");
      var closeBtn = box.querySelector(".lightbox__close");
      var prevBtn = box.querySelector(".lightbox__nav--prev");
      var nextBtn = box.querySelector(".lightbox__nav--next");
      var count = box.querySelector(".lightbox__count");
      var group = [];
      var index = 0;
      var lastFocus = null;
      function show(i) {
        index = (i + group.length) % group.length;
        var a = group[index];
        var im = a.querySelector("img");
        img.src = a.getAttribute("href");
        img.alt = im ? im.alt : "";
        count.textContent = group.length > 1 ? index + 1 + " / " + group.length : "";
      }
      function open(a) {
        lastFocus = document.activeElement;
        var gallery = a.closest(".ev-list-photos");
        group = gallery ? Array.prototype.slice.call(gallery.querySelectorAll("a.ev-shot")) : [a];
        var multi = group.length > 1;
        prevBtn.hidden = !multi;
        nextBtn.hidden = !multi;
        show(group.indexOf(a));
        box.hidden = false;
        document.body.style.overflow = "hidden";
        closeBtn.focus();
      }
      function close() {
        box.hidden = true;
        img.src = "";
        document.body.style.overflow = "";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      shots.forEach(function (a) {
        a.addEventListener("click", function (e) {
          e.preventDefault();
          open(a);
        });
      });
      box.addEventListener("click", function (e) {
        if (e.target === box || e.target === img) close();
      });
      closeBtn.addEventListener("click", close);
      prevBtn.addEventListener("click", function () { show(index - 1); });
      nextBtn.addEventListener("click", function () { show(index + 1); });
      document.addEventListener("keydown", function (e) {
        if (box.hidden) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowLeft" && group.length > 1) { e.preventDefault(); show(index - 1); }
        else if (e.key === "ArrowRight" && group.length > 1) { e.preventDefault(); show(index + 1); }
      });
    })();
  </script>
