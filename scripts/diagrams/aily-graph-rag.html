<figure class="aily-flow" data-aily-flow tabindex="0" aria-labelledby="aily-flow-title">
<div class="aily-flow__head">
<p class="aily-flow__title" id="aily-flow-title">Graph RAG pipeline</p>
<div class="aily-flow__controls">
<button type="button" class="aily-flow__ctl" data-action="prev" aria-label="Previous step">←</button>
<button type="button" class="aily-flow__ctl aily-flow__ctl--play" data-action="play" aria-label="Play walkthrough">Play</button>
<button type="button" class="aily-flow__ctl" data-action="next" aria-label="Next step">→</button>
<span class="aily-flow__counter" data-counter aria-live="polite">1 / 6</span>
</div>
</div>
<div class="aily-flow__track" data-track style="--progress: 0">
<ol class="aily-flow__list">
<li><button type="button" class="aily-flow__step" data-step="0" style="--step-color: #c4a574" aria-current="step"><span class="aily-flow__label">Factory manuals</span><span class="aily-flow__detail">PDF · OCR scans</span></button></li>
<li><button type="button" class="aily-flow__step" data-step="1" style="--step-color: #6eb5c4"><span class="aily-flow__label">unstructured.io</span><span class="aily-flow__detail">tables · figures · pages</span></button></li>
<li><button type="button" class="aily-flow__step" data-step="2" style="--step-color: #7eb896"><span class="aily-flow__label">Neo4j</span><span class="aily-flow__detail">equipment graph</span></button></li>
<li><button type="button" class="aily-flow__step" data-step="3" style="--step-color: #e88a8a"><span class="aily-flow__label">Daily fault</span><span class="aily-flow__detail">what failed on the line</span></button></li>
<li><button type="button" class="aily-flow__step" data-step="4" style="--step-color: #9bb4ff"><span class="aily-flow__label">LangChain</span><span class="aily-flow__detail">graph RAG + tools</span></button></li>
<li><button type="button" class="aily-flow__step" data-step="5" style="--step-color: #c7d2fe"><span class="aily-flow__label">Cited answer</span><span class="aily-flow__detail">page · section · figure</span></button></li>
</ol>
</div>
<div class="aily-flow__panel" data-panel aria-live="polite">
<p class="aily-flow__panel-text" data-panel-text>Scanned equipment manuals from the factory—PDF and OCR on diagram pages.</p>
</div>
<p class="aily-flow__outcome">Operator gets the fault, the manual location, and the exact page—not a vague summary.</p>
</figure>
<script>
(function () {
  var root = document.querySelector("[data-aily-flow]");
  if (!root) return;
  var hints = [
    "Scanned equipment manuals from the factory—PDF and OCR on diagram pages.",
    "unstructured.io preserves layout: tables, figures, and text blocks, each tagged with page and section coordinates.",
    "Neo4j equipment graph links machines, components, fault codes, and repair procedures.",
    "Each day the line reports what failed—which machine, which alarm, which shift.",
    "LangChain graph RAG retrieves the relevant subgraph and tool results for that fault.",
    "Production API returns a cited answer: exact page, section, and figure reference for the operator."
  ];
  var steps = root.querySelectorAll(".aily-flow__step");
  var panel = root.querySelector("[data-panel-text]");
  var panelBox = root.querySelector("[data-panel]");
  var counter = root.querySelector("[data-counter]");
  var track = root.querySelector("[data-track]");
  var playBtn = root.querySelector('[data-action="play"]');
  var total = steps.length;
  var index = 0;
  var timer = null;
  var playing = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var STEP_MS = 3200;
  var LOOP_PAUSE_MS = 800;
  var advanceTimer = null;

  function clearVisited() {
    steps.forEach(function (btn) {
      btn.classList.remove("is-visited");
    });
  }

  function updatePanelText(text, animate) {
    if (!panel) return;
    if (!animate || reduced) {
      panel.textContent = text;
      return;
    }
    if (!panelBox) {
      panel.textContent = text;
      return;
    }
    panelBox.classList.add("is-panel-swapping");
    window.setTimeout(function () {
      panel.textContent = text;
      panelBox.classList.remove("is-panel-swapping");
    }, 180);
  }

  function pulseStep(stepEl) {
    if (!stepEl || reduced) return;
    stepEl.classList.remove("is-entering");
    void stepEl.offsetWidth;
    stepEl.classList.add("is-entering");
    function onEnd() {
      stepEl.classList.remove("is-entering");
      stepEl.removeEventListener("animationend", onEnd);
    }
    stepEl.addEventListener("animationend", onEnd);
  }

  function setAdvancing(on) {
    if (advanceTimer) {
      clearTimeout(advanceTimer);
      advanceTimer = null;
    }
    root.classList.toggle("is-advancing", on);
    if (on && !reduced) {
      advanceTimer = window.setTimeout(function () {
        root.classList.remove("is-advancing");
        advanceTimer = null;
      }, 600);
    }
  }

  function setStep(i, opts) {
    opts = opts || {};
    var animate = !!opts.animate && !reduced;
    var trackVisited = !!opts.trackVisited;
    index = (i + total) % total;
    steps.forEach(function (btn, n) {
      var on = n === index;
      btn.setAttribute("aria-current", on ? "step" : "false");
      btn.classList.toggle("is-active", on);
      if (trackVisited && n < index) {
        btn.classList.add("is-visited");
      } else {
        btn.classList.remove("is-visited");
      }
    });
    updatePanelText(hints[index], animate);
    if (panelBox && steps[index]) {
      var color = getComputedStyle(steps[index]).getPropertyValue("--step-color").trim();
      if (color) panelBox.style.setProperty("--panel-color", color);
    }
    if (counter) counter.textContent = index + 1 + " / " + total;
    if (track) track.style.setProperty("--progress", String(index / Math.max(total - 1, 1)));
    if (animate) {
      pulseStep(steps[index]);
      if (!playing) setAdvancing(true);
    }
    if (steps[index] && root.offsetWidth < 768) {
      steps[index].scrollIntoView({
        inline: "center",
        block: "nearest",
        behavior: reduced ? "auto" : "smooth",
      });
    }
  }

  function advanceStep(delta) {
    stopPlay();
    setStep(index + delta, { animate: true, trackVisited: true });
  }

  function stopPlay() {
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
    playing = false;
    root.classList.remove("is-playing");
    if (playBtn) {
      playBtn.textContent = "Play";
      playBtn.setAttribute("aria-label", "Play walkthrough");
      playBtn.classList.remove("is-playing");
    }
  }

  function scheduleNextStep() {
    if (!playing) return;
    var delay = index === total - 1 ? LOOP_PAUSE_MS : STEP_MS;
    timer = window.setTimeout(function () {
      if (!playing) return;
      var next = index === total - 1 ? 0 : index + 1;
      setStep(next, { animate: true, trackVisited: true });
      scheduleNextStep();
    }, delay);
  }

  function startPlay() {
    if (reduced) return;
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
    playing = true;
    root.classList.add("is-playing");
    if (playBtn) {
      playBtn.textContent = "Pause";
      playBtn.setAttribute("aria-label", "Pause walkthrough");
      playBtn.classList.add("is-playing");
    }
    setStep(index, { animate: true, trackVisited: true });
    scheduleNextStep();
  }

  root.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (btn) {
      var action = btn.getAttribute("data-action");
      if (action === "play") {
        if (playing) stopPlay();
        else startPlay();
        return;
      }
      stopPlay();
      if (action === "prev") advanceStep(-1);
      if (action === "next") advanceStep(1);
      return;
    }
    var step = e.target.closest(".aily-flow__step");
    if (step) {
      stopPlay();
      clearVisited();
      setStep(Number(step.getAttribute("data-step")) || 0);
    }
  });

  root.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      advanceStep(-1);
    }
    if (e.key === "ArrowRight") {
      e.preventDefault();
      advanceStep(1);
    }
  });

  setStep(0);
})();
</script>
