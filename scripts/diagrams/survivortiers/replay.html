<figure class="fig fig-sim" data-trace="../../assets/experience/survivortiers/trace-keldeo.json">
<canvas class="fig-sim__canvas" width="1280" height="720" role="img" aria-label="Replay of one simulated game: Keldeo with Water Gun moves away from enemies closing in from every side until its HP runs out at 113.7 seconds."></canvas>
<div class="fig-sim__hud">
<span class="fig-sim__who">Keldeo · Water Gun · seed 1</span>
<span class="fig-sim__time">0.0 s</span>
<span class="fig-sim__hp" aria-hidden="true"><span class="fig-sim__hpbar"></span></span>
<button class="fig-sim__toggle" type="button">Pause</button>
</div>
<p class="fig-sim__legend" aria-hidden="true"><span class="fig-sim__dot fig-sim__dot--me"></span> Keldeo, the camera follows it <span class="fig-sim__dot fig-sim__dot--foe"></span> walking enemy <span class="fig-sim__dot fig-sim__dot--alt"></span> flying enemy</p>
<figcaption class="fig__caption">A real game recorded from the Rust simulator, played back at 4× speed. The bot moves away from the swarm while its one attack fires on its own. It survived 113.7 seconds and defeated 82 enemies. Projectiles are not recorded in the trace.</figcaption>
<script>
(function () {
  var fig = document.currentScript.closest(".fig-sim");
  var canvas = fig.querySelector("canvas");
  var ctx = canvas.getContext("2d");
  var timeEl = fig.querySelector(".fig-sim__time");
  var hpEl = fig.querySelector(".fig-sim__hpbar");
  var btn = fig.querySelector(".fig-sim__toggle");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SPEED = 4, HOLD = 1800;
  var data = null, frames = null, t = 0, playing = !reduce, visible = false, last = 0, holdUntil = 0;

  function color(name) { return getComputedStyle(fig).getPropertyValue(name).trim() || "#888"; }

  function frameAt(time) {
    var lo = 0, hi = frames.length - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (frames[mid][0] <= time) lo = mid; else hi = mid - 1; }
    return lo;
  }

  function draw() {
    var W = canvas.width, H = canvas.height, k = W / (2 * data.view);
    var i = frameAt(t), f = frames[i], g = frames[Math.min(i + 1, frames.length - 1)];
    var span = g[0] - f[0], a = span > 0 ? Math.min(1, (t - f[0]) / span) : 0;
    var px = f[2] + (g[2] - f[2]) * a, py = f[3] + (g[3] - f[3]) * a;
    ctx.clearRect(0, 0, W, H);

    // Ground grid scrolls with the camera so movement reads.
    ctx.strokeStyle = color("--hairline");
    ctx.lineWidth = 1;
    var step = 80 * k, ox = (-px * k) % step, oy = (-py * k) % step;
    ctx.beginPath();
    for (var gx = ox; gx < W; gx += step) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (var gy = oy; gy < H; gy += step) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();

    // The bot's recent path, relative to where it is now.
    ctx.strokeStyle = color("--syn-link");
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var j = Math.max(0, i - 24); j <= i; j++) {
      var sx = W / 2 + (frames[j][2] - px) * k, sy = H / 2 + (frames[j][3] - py) * k;
      if (j === Math.max(0, i - 24)) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Enemies, stored relative to the bot at their own frame.
    var foe = color("--syn-code"), alt = color("--syn-heading"), e = f[4];
    for (var n = 0; n < e.length; n += 4) {
      ctx.fillStyle = e[n + 3] ? alt : foe;
      ctx.beginPath();
      ctx.arc(W / 2 + (e[n] + f[2] - px) * k, H / 2 + (e[n + 1] + f[3] - py) * k, Math.max(3, e[n + 2] * k), 0, 6.283);
      ctx.fill();
    }

    ctx.fillStyle = color("--accent");
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 14.08 * k, 0, 6.283);
    ctx.fill();

    timeEl.textContent = t.toFixed(1) + " s";
    hpEl.style.width = Math.max(0, f[1] / data.maxHp * 100) + "%";
  }

  function tick(now) {
    if (!playing || !visible) { last = 0; return; }
    if (last) {
      if (now < holdUntil) { requestAnimationFrame(tick); return; }
      t += (now - last) / 1000 * SPEED;
      if (t >= data.time) { t = data.time; holdUntil = now + HOLD; draw(); t = 0; last = now; requestAnimationFrame(tick); return; }
    }
    last = now;
    draw();
    requestAnimationFrame(tick);
  }

  function start() { if (playing && visible && data) requestAnimationFrame(tick); }

  btn.addEventListener("click", function () {
    playing = !playing;
    btn.textContent = playing ? "Pause" : "Play";
    start();
  });
  if (reduce) btn.textContent = "Play";

  fetch(fig.getAttribute("data-trace")).then(function (r) { return r.json(); }).then(function (d) {
    data = d; frames = d.frames;
    if (!playing) t = 100;
    draw();
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        visible = entries[0].isIntersecting;
        start();
      }).observe(fig);
    } else { visible = true; start(); }
  });
})();
</script>
</figure>
