  <script>
    (function () {
      var shots = document.querySelectorAll("a.ev-shot");
      if (!shots.length) return;
      var box = document.getElementById("lightbox");
      var img = box.querySelector(".lightbox__img");
      var closeBtn = box.querySelector(".lightbox__close");
      var prevBtn = box.querySelector(".lightbox__nav--prev");
      var nextBtn = box.querySelector(".lightbox__nav--next");
      var count = box.querySelector(".lightbox__count");
      var group = [];
      var index = 0;
      var lastFocus = null;
      function show(i) {
        index = (i + group.length) % group.length;
        var a = group[index];
        var im = a.querySelector("img");
        img.src = a.getAttribute("href");
        img.alt = im ? im.alt : "";
        count.textContent = group.length > 1 ? index + 1 + " / " + group.length : "";
      }
      function open(a) {
        lastFocus = document.activeElement;
        var gallery = a.closest(".ev-list-photos");
        group = gallery ? Array.prototype.slice.call(gallery.querySelectorAll("a.ev-shot")) : [a];
        var multi = group.length > 1;
        prevBtn.hidden = !multi;
        nextBtn.hidden = !multi;
        show(group.indexOf(a));
        box.hidden = false;
        document.body.style.overflow = "hidden";
        closeBtn.focus();
      }
      function close() {
        box.hidden = true;
        img.src = "";
        document.body.style.overflow = "";
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      shots.forEach(function (a) {
        a.addEventListener("click", function (e) {
          e.preventDefault();
          open(a);
        });
      });
      box.addEventListener("click", function (e) {
        if (e.target === box || e.target === img) close();
      });
      closeBtn.addEventListener("click", close);
      prevBtn.addEventListener("click", function () { show(index - 1); });
      nextBtn.addEventListener("click", function () { show(index + 1); });
      document.addEventListener("keydown", function (e) {
        if (box.hidden) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowLeft" && group.length > 1) { e.preventDefault(); show(index - 1); }
        else if (e.key === "ArrowRight" && group.length > 1) { e.preventDefault(); show(index + 1); }
      });
    })();
  </script>
  <script>
    (function () {
      // Animated figures replay in a loop while on screen: play, hold the
      // end state, fade out, snap back to the start, fade in, play again.
      // data-play holds the length of one run in ms. Reduced motion keeps
      // the static end state.
      var figs = document.querySelectorAll("figure[data-play]");
      if (!figs.length || !("IntersectionObserver" in window)) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var HOLD = 2600, FADE = 250, GAP = 450;
      figs.forEach(function (fig) {
        var run = parseInt(fig.getAttribute("data-play"), 10) || 3000;
        var timer = null;
        fig._visible = false;
        fig.classList.add("fig--armed");
        function cycle() {
          fig.classList.add("fig--play");
          timer = setTimeout(function () {
            fig.classList.add("fig--fade");
            timer = setTimeout(function () {
              fig.classList.remove("fig--play", "fig--fade");
              timer = setTimeout(function () {
                timer = null;
                if (fig._visible) cycle();
              }, GAP);
            }, FADE);
          }, run + HOLD);
        }
        fig._start = function () {
          fig._visible = true;
          if (!timer) timer = setTimeout(function () { timer = null; cycle(); }, 150);
        };
      });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) e.target._start();
          else e.target._visible = false;
        });
      }, { threshold: 0.3 });
      figs.forEach(function (fig) { io.observe(fig); });
    })();
  </script>
